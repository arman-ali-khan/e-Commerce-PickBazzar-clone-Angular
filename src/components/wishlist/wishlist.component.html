<div class="bg-white">
  <div class="container mx-auto px-4 py-12 lg:py-20">
    <div class="text-center mb-10">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-800">My Wishlist</h1>
      <p class="text-gray-500 mt-2">Your saved products for later.</p>
    </div>

    @if (wishlistProducts().length > 0) {
      <app-product-grid [title]="''" [products]="wishlistProducts()"></app-product-grid>
    } @else {
      <div class="text-center py-20">
        <svg class="mx-auto h-16 w-16 text-gray-300" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <h3 class="mt-4 text-2xl font-semibold text-gray-800">Your wishlist is empty</h3>
        <p class="mt-2 text-gray-500">Looks like you haven't added anything to your wishlist yet.</p>
        <a routerLink="/store" class="mt-6 inline-block bg-brand hover:bg-brand-dark text-white font-bold py-3 px-6 rounded-lg transition-colors">
          Explore Products
        </a>
      </div>
    }
  </div>
</div>
