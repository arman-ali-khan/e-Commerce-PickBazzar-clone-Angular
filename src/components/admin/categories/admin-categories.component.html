<div class="container mx-auto">
  <h1 class="text-3xl font-bold text-gray-800 mb-6">Categories</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
    <!-- Add Category Form -->
    <div class="md:col-span-1">
      <div class="bg-white p-6 rounded-lg shadow-sm">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">Add New Category</h2>
        <form [formGroup]="categoryForm" (ngSubmit)="addCategory()" class="space-y-4">
          <div>
            <label for="name" class="block text-sm font-medium text-gray-600">Category Name</label>
            <input type="text" id="name" formControlName="name" class="mt-1 w-full border-gray-300 rounded-md shadow-sm">
          </div>
          <div>
            <label for="icon" class="block text-sm font-medium text-gray-600">Icon (Emoji)</label>
            <input type="text" id="icon" formControlName="icon" class="mt-1 w-full border-gray-300 rounded-md shadow-sm" placeholder="e.g., 🍎">
          </div>
          <button type="submit" [disabled]="categoryForm.invalid" class="w-full px-4 py-2 bg-brand text-white font-semibold rounded-md hover:bg-brand-dark transition-colors disabled:bg-gray-300">
            Add Category
          </button>
        </form>
      </div>
    </div>
    
    <!-- Category List -->
    <div class="md:col-span-2">
      <div class="bg-white p-6 rounded-lg shadow-sm">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">Existing Categories</h2>
        <div class="space-y-3">
          @for(category of categories(); track category.name) {
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-md">
              <div class="flex items-center">
                <span class="text-2xl mr-3">{{ category.icon }}</span>
                <span class="font-medium text-gray-800">{{ category.name }}</span>
              </div>
              <button (click)="deleteCategory(category.name)" class="text-red-500 hover:text-red-700">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          } @empty {
            <p class="text-gray-500">No categories found.</p>
          }
        </div>
      </div>
    </div>
  </div>
</div>
