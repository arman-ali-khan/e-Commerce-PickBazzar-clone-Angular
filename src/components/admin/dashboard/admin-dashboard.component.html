<div class="container mx-auto">
  <h1 class="text-3xl font-bold text-gray-800 mb-6">Dashboard</h1>

  <!-- Stats Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <!-- Total Revenue -->
    <div class="bg-white p-6 rounded-lg shadow-sm flex items-center">
      <div class="w-12 h-12 flex items-center justify-center bg-green-100 rounded-full mr-4">
        <svg class="w-6 h-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v.01"/></svg>
      </div>
      <div>
        <p class="text-sm text-gray-500">Total Revenue</p>
        <p class="text-2xl font-bold text-gray-800">{{ totalRevenue() | currency }}</p>
      </div>
    </div>
    <!-- Total Orders -->
    <div class="bg-white p-6 rounded-lg shadow-sm flex items-center">
      <div class="w-12 h-12 flex items-center justify-center bg-blue-100 rounded-full mr-4">
        <svg class="w-6 h-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      </div>
      <div>
        <p class="text-sm text-gray-500">Total Orders</p>
        <p class="text-2xl font-bold text-gray-800">{{ totalOrders() }}</p>
      </div>
    </div>
    <!-- Total Products -->
    <div class="bg-white p-6 rounded-lg shadow-sm flex items-center">
      <div class="w-12 h-12 flex items-center justify-center bg-indigo-100 rounded-full mr-4">
        <svg class="w-6 h-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
      </div>
      <div>
        <p class="text-sm text-gray-500">Total Products</p>
        <p class="text-2xl font-bold text-gray-800">{{ totalProducts() }}</p>
      </div>
    </div>
    <!-- Low Stock -->
    <div class="bg-white p-6 rounded-lg shadow-sm flex items-center">
      <div class="w-12 h-12 flex items-center justify-center bg-red-100 rounded-full mr-4">
        <svg class="w-6 h-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.343 16c-.77 1.333.192 3 1.732 3z"/></svg>
      </div>
      <div>
        <p class="text-sm text-gray-500">Low Stock Items</p>
        <p class="text-2xl font-bold text-gray-800">{{ lowStockCount() }}</p>
      </div>
    </div>
  </div>
</div>
