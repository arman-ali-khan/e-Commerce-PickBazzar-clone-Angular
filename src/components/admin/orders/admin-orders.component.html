<div class="container mx-auto">
  <h1 class="text-3xl font-bold text-gray-800 mb-6">Orders</h1>

  <div class="bg-white p-6 rounded-lg shadow-sm overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Order ID</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Customer</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Total</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        @for (order of orders(); track order.id) {
          <tr>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ order.id }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">Jane Doe</td> <!-- Mock customer -->
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ order.date }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ order.total | currency }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm">
                <select 
                    [value]="order.status"
                    (change)="updateStatus(order, $event)"
                    class="rounded-md border-gray-300 shadow-sm text-sm"
                    [class.bg-green-100]="order.status === 'Delivered'"
                    [class.text-green-800]="order.status === 'Delivered'"
                    [class.bg-yellow-100]="order.status === 'Processing'"
                    [class.text-yellow-800]="order.status === 'Processing'"
                    [class.bg-red-100]="order.status === 'Cancelled'"
                    [class.text-red-800]="order.status === 'Cancelled'">
                    <option value="Processing">Processing</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
