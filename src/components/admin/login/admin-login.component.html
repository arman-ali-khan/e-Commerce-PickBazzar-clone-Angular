<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-sm p-8 space-y-6 bg-white rounded-lg shadow-md">
    <div class="text-center">
        <div class="flex justify-center items-center space-x-2 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-dark"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
            <span class="text-2xl font-bold text-gray-800">PickBazar</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
        <p class="text-gray-500">Please enter password to continue</p>
    </div>
    <form (ngSubmit)="login()" class="space-y-4">
      <div>
        <label for="password" class="sr-only">Password</label>
        <input 
          [formControl]="password"
          id="password" 
          name="password" 
          type="password" 
          required 
          class="w-full px-4 py-2 text-center border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand" 
          placeholder="Password">
      </div>
      
      @if (error()) {
        <p class="text-sm text-red-600 text-center">{{ error() }}</p>
      }

      <button 
        type="submit" 
        class="w-full px-4 py-2 font-semibold text-white bg-brand rounded-md hover:bg-brand-dark transition-colors">
        Login
      </button>
    </form>
    <div class="text-center">
        <a routerLink="/" class="text-sm text-brand hover:underline">← Back to Storefront</a>
    </div>
  </div>
</div>
