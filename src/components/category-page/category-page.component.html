<div class="bg-white">
    <div class="container mx-auto px-4 py-12 lg:py-20">
        <nav class="text-sm mb-6" aria-label="Breadcrumb">
            <ol class="list-none p-0 inline-flex space-x-2">
                <li class="flex items-center">
                    <a routerLink="/" class="text-gray-500 hover:text-brand">Home</a>
                </li>
                <li class="flex items-center">
                    <svg class="w-4 h-4 text-gray-400 mx-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    <a routerLink="/categories" class="text-gray-500 hover:text-brand">Categories</a>
                </li>
                <li class="flex items-center">
                    <svg class="w-4 h-4 text-gray-400 mx-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    <span class="text-gray-700 font-medium">{{ categoryName() }}</span>
                </li>
            </ol>
        </nav>

        <h1 class="text-3xl lg:text-4xl font-bold text-gray-800 mb-10">
            {{ categoryName() }}
        </h1>

        @if (products().length > 0) {
            <app-product-grid [title]="''" [products]="products()"></app-product-grid>
        } @else {
            <div class="text-center py-16">
                <p class="text-xl text-gray-600">No products found in this category.</p>
            </div>
        }
    </div>
</div>
